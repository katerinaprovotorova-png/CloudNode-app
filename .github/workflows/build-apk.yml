name: Build CloudNode APK

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate translations
        run: dart run slang

      - name: Download Android Core Libraries (CRITICAL FIX)
        run: |
          mkdir -p android/app/libs
          # Скачиваем последнюю версию нативных библиотек ядра
          LATEST_URL=$(curl -s https://api.github.com/repos/hiddify/hiddify-core/releases/latest | grep "browser_download_url.*hiddify-core-android.tar.gz" | cut -d '"' -f 4)
          echo "Downloading core libraries from: $LATEST_URL"
          curl -L "$LATEST_URL" | tar xz -C android/app/libs/

      - name: Build Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudNode-Android-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
